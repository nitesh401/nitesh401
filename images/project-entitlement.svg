<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Entitlement Management System">
  <defs>
    <linearGradient id="bgEnt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#152a4d"/>
      <stop offset="55%" stop-color="#1f3864"/>
      <stop offset="100%" stop-color="#0f7a52"/>
    </linearGradient>
    <linearGradient id="cardEnt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <radialGradient id="glowEnt" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3ee6a8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3ee6a8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgEnt)"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="133" y1="0" x2="133" y2="450"/>
    <line x1="266" y1="0" x2="266" y2="450"/>
    <line x1="399" y1="0" x2="399" y2="450"/>
    <line x1="532" y1="0" x2="532" y2="450"/>
    <line x1="665" y1="0" x2="665" y2="450"/>
  </g>

  <circle cx="140" cy="120" r="160" fill="url(#glowEnt)"/>

  <!-- RBAC node graph, right side -->
  <g transform="translate(430,60)" stroke="#8fe6c5" stroke-opacity="0.55" stroke-width="1.5" fill="none">
    <line x1="70" y1="40" x2="0" y2="110"/>
    <line x1="70" y1="40" x2="150" y2="20"/>
    <line x1="70" y1="40" x2="150" y2="100"/>
    <line x1="0" y1="110" x2="30" y2="190"/>
    <line x1="150" y1="100" x2="130" y2="190"/>
    <line x1="150" y1="20" x2="230" y2="70"/>
    <line x1="150" y1="100" x2="230" y2="70"/>
  </g>
  <g transform="translate(430,60)">
    <circle cx="70" cy="40" r="9" fill="#3ee6a8"/>
    <circle cx="0" cy="110" r="6" fill="#ffffff" fill-opacity="0.85"/>
    <circle cx="150" cy="20" r="6" fill="#ffffff" fill-opacity="0.85"/>
    <circle cx="150" cy="100" r="6" fill="#ffffff" fill-opacity="0.85"/>
    <circle cx="30" cy="190" r="5" fill="#ffffff" fill-opacity="0.6"/>
    <circle cx="130" cy="190" r="5" fill="#ffffff" fill-opacity="0.6"/>
    <circle cx="230" cy="70" r="6" fill="#ffffff" fill-opacity="0.85"/>
  </g>

  <!-- Key / access icon card -->
  <g transform="translate(70,150)">
    <rect x="-20" y="-20" width="200" height="200" rx="24" fill="url(#cardEnt)" stroke="#ffffff" stroke-opacity="0.15"/>
    <g transform="translate(50,50)" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="28" cy="28" r="24"/>
      <path d="M46 46 L96 96"/>
      <path d="M78 78 L92 64"/>
      <path d="M92 92 L106 78"/>
    </g>
  </g>

  <!-- audit / ledger lines -->
  <g transform="translate(560,270)" fill="#ffffff" fill-opacity="0.85">
    <rect x="0" y="0" width="120" height="10" rx="5" fill-opacity="0.5"/>
    <rect x="0" y="24" width="90" height="10" rx="5" fill-opacity="0.35"/>
    <rect x="0" y="48" width="105" height="10" rx="5" fill-opacity="0.35"/>
  </g>

  <text x="60" y="380" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Entitlement Management</text>
  <text x="60" y="412" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#bfe9d8">Role-based access &amp; licensing lifecycle platform</text>
</svg>
