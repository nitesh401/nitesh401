<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Credit Studio">
  <defs>
    <linearGradient id="bgCred" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f7a52"/>
      <stop offset="50%" stop-color="#1f3864"/>
      <stop offset="100%" stop-color="#152a4d"/>
    </linearGradient>
    <linearGradient id="cardFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e5c9c"/>
      <stop offset="100%" stop-color="#173257"/>
    </linearGradient>
    <linearGradient id="chipG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe9a8"/>
      <stop offset="100%" stop-color="#d9b25c"/>
    </linearGradient>
    <radialGradient id="glowCred" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3ee6a8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3ee6a8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgCred)"/>
  <circle cx="660" cy="90" r="180" fill="url(#glowCred)"/>

  <!-- bar chart, right side -->
  <g transform="translate(470,230)">
    <rect x="0"  y="70" width="34" height="60"  rx="6" fill="#ffffff" fill-opacity="0.25"/>
    <rect x="46" y="40" width="34" height="90"  rx="6" fill="#ffffff" fill-opacity="0.4"/>
    <rect x="92" y="10" width="34" height="120" rx="6" fill="#3ee6a8"/>
    <rect x="138" y="55" width="34" height="75" rx="6" fill="#ffffff" fill-opacity="0.4"/>
    <rect x="184" y="25" width="34" height="105" rx="6" fill="#ffffff" fill-opacity="0.55"/>
  </g>

  <!-- workflow dots (Camunda-style approval chain) -->
  <g transform="translate(470,60)" stroke="#8fe6c5" stroke-opacity="0.6" stroke-width="2" fill="none">
    <line x1="10" y1="10" x2="80" y2="10"/>
    <line x1="80" y1="10" x2="150" y2="10"/>
    <line x1="150" y1="10" x2="220" y2="10"/>
  </g>
  <g transform="translate(470,60)">
    <circle cx="10" cy="10" r="8" fill="#ffffff"/>
    <circle cx="80" cy="10" r="8" fill="#ffffff"/>
    <circle cx="150" cy="10" r="8" fill="#3ee6a8"/>
    <circle cx="220" cy="10" r="10" fill="none" stroke="#3ee6a8" stroke-width="3"/>
    <path d="M214 10 L219 15 L228 4" stroke="#3ee6a8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- credit card illustration -->
  <g transform="translate(60,140) rotate(-8)">
    <rect x="0" y="0" width="260" height="160" rx="18" fill="url(#cardFace)" stroke="#ffffff" stroke-opacity="0.18"/>
    <rect x="26" y="34" width="42" height="32" rx="6" fill="url(#chipG)"/>
    <text x="26" y="112" font-family="'Courier New', monospace" font-size="22" letter-spacing="3" fill="#ffffff" fill-opacity="0.9">4291 88•• •••• 0417</text>
    <text x="26" y="140" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="2" fill="#bfe9d8">CREDIT STUDIO</text>
    <circle cx="222" cy="34" r="16" fill="#ffffff" fill-opacity="0.25"/>
    <circle cx="236" cy="34" r="16" fill="#3ee6a8" fill-opacity="0.55"/>
  </g>

  <text x="60" y="380" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Credit Studio</text>
  <text x="60" y="412" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#bfe9d8">Credit approval workflows for banking &amp; insurance</text>
</svg>
